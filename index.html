<!DOCTYPE html>
<html>
<head>
  <title>Bruno Doidão 2D com Ranking Colorido</title>
  <style>
    body { background: black; color: white; text-align: center; }
    canvas { display: block; margin: auto; }
    #start, #pause, #restart {
      font-size: 20px;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
    }
    #playerName {
      font-size: 18px;
      padding: 5px;
      margin: 10px;
    }
  </style>
</head>
<body>
  <h2>Bruno Doidão 2D</h2>
  <input id="playerName" type="text" placeholder="Digite seu nome">
  <button id="start">▶ Iniciar Jogo</button>
  <button id="pause" style="display:none;">⏸ Pause</button>
  <button id="restart" style="display:none;">🔄 Reiniciar</button>
  <canvas id="game" width="640" height="480"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // Sprites
    const bgImg = new Image(); bgImg.src = "doom_background.png";
    const playerImg = new Image(); playerImg.src = "player.png";
    const enemyImg = new Image(); enemyImg.src = "enemy.png";
    const bossImg = new Image(); bossImg.src = "boss.png";
    const bloodImg = new Image(); bloodImg.src = "blood.png";

    // Sons
    const shootBuffer = new Audio("shoot.wav");
    const deathBuffer = new Audio("death.wav");
    const gameOverSound = new Audio("gameover.wav");
    const music = new Audio("doom_music.mp3");
    music.loop = true;
    music.volume = 0.2;

    function playSound(buffer) {
      const sound = buffer.cloneNode();
      sound.volume = 0.6;
      sound.play();
    }

    // Player gigante
    let player, bullets, enemyBullets, enemies;
    let paused = false;
    let gameOver = false;
    let loopInterval;

    // Ranking Top 3
    let ranking = [];

    function resetGame() {
      player = { x: 320, y: 380, hp: 100, score: 0, size: 200 };
      bullets = [];
      enemyBullets = [];
      enemies = [
        { x: 100, y: 100, alive: true, big: false },
        { x: 500, y: 200, alive: true, big: false }
      ];
      paused = false;
      gameOver = false;
      document.getElementById("pause").style.display = "inline-block";
      document.getElementById("restart").style.display = "none";
      music.currentTime = 0;
      music.play();
    }

    const keys = {};
    document.onkeydown = e => keys[e.keyCode] = true;
    document.onkeyup = e => keys[e.keyCode] = false;

    function update() {
      if(paused || gameOver) return;

      if(keys[37]) player.x -= 8;
      if(keys[39]) player.x += 8;
      if(keys[38]) player.y -= 8;
      if(keys[40]) player.y += 8;

      if(keys[32]) { // espaço para atirar
        bullets.push({ x: player.x, y: player.y - player.size/2, dx: 0, dy: -15 });
        playSound(shootBuffer);
        keys[32] = false;
      }

      // Balas do player
      bullets.forEach(b => {
        b.x += b.dx;
        b.y += b.dy;
        enemies.forEach(e => {
          if(e.alive && Math.abs(b.x - e.x) < 20 && Math.abs(b.y - e.y) < 20) {
            e.alive = false;
            player.score += 100;
            playSound(deathBuffer);
            enemies.push({ x: Math.random()*600, y: Math.random()*300, alive: true, big: true });
          }
        });
      });

      // Inimigos atiram
      enemies.forEach(e => {
        if(e.alive && Math.random() < 0.01) {
          enemyBullets.push({ x: e.x, y: e.y, dx: 0, dy: 5 });
        }
      });

      // Balas dos inimigos
      enemyBullets.forEach(b => {
        b.x += b.dx;
        b.y += b.dy;
        if(Math.abs(b.x - player.x) < player.size/2 && Math.abs(b.y - player.y) < player.size/2) {
          player.hp -= 10;
          b.hit = true;
          if(player.hp <= 0) {
            gameOver = true;
            music.pause();
            gameOverSound.play();
            document.getElementById("pause").style.display = "none";
            document.getElementById("restart").style.display = "inline-block";

            // Atualiza ranking
            let name = document.getElementById("playerName").value || "Anônimo";
            ranking.push({ name: name, score: player.score });
            ranking.sort((a,b) => b.score - a.score);
            if(ranking.length > 3) ranking = ranking.slice(0,3);
          }
        }
      });

      // Remove balas
      for(let i = enemyBullets.length-1; i >= 0; i--) {
        if(enemyBullets[i].hit || enemyBullets[i].y > 480) {
          enemyBullets.splice(i,1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0,0,640,480);

      // Fundo
      ctx.drawImage(bgImg, 0, 0, 640, 480);

      // Player
      ctx.drawImage(playerImg, player.x - player.size/2, player.y - player.size/2, player.size, player.size);

      // Balas do player
      ctx.fillStyle = "red";
      bullets.forEach(b => ctx.fillRect(b.x, b.y, 4, 8));

      // Balas dos inimigos
      ctx.fillStyle = "yellow";
      enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, 6, 12));

      // Inimigos
      enemies.forEach(e => {
        if(e.alive) {
          if(e.big) {
            ctx.drawImage(bossImg, e.x-30, e.y-30, 60, 60);
          } else {
            ctx.drawImage(enemyImg, e.x-20, e.y-20, 40, 40);
          }
        } else {
          ctx.drawImage(bloodImg, e.x-20, e.y-20, 40, 40);
        }
      });

      // HUD
      ctx.fillStyle = "white";
      ctx.font = "16px Arial";
      ctx.fillText("HP: " + player.hp, 20, 460);
      ctx.fillText("Score: " + player.score, 500, 460);

      // Ranking Top 3 colorido e espaçado com título
      ctx.font = "14px Arial";
      ctx.fillStyle = "white";
      ctx.fillText("Ranking:", 20, 20);

      const colors = ["gold", "silver", "orange"];
      ranking.forEach((r, i) => {
        ctx.fillStyle = colors[i];
        ctx.fillText((i+1)+"º "+r.name+": "+r.score, 120 + i*160, 20); 
      });

      if(paused) {
        ctx.fillStyle = "yellow";
        ctx.font = "30px Arial";
        ctx.fillText("PAUSADO", 250, 240);
      }

      if(gameOver) {
        ctx.fillStyle = "red";
        ctx.font = "40px Arial";
        ctx.fillText("GAME OVER", 220, 240);
      }
    }

    function loop() {
      update();
      draw();
    }

    // Botão iniciar
    document.getElementById("start").addEventListener("click", () => {
      resetGame();
      document.getElementById("start").style.display = "none";
      loopInterval = setInterval(loop, 1000/30);
    });

    // Botão pause
    document.getElementById("pause").addEventListener("click", () => {
      if(gameOver) return;
      paused = !paused;
      document.getElementById("pause").textContent = paused ? "▶ Continuar" : "⏸ Pause";
      if(paused) music.pause(); else music.play();
    });

    // Botão reiniciar
    document.getElementById("restart").addEventListener("click", () => {
      resetGame();
    });
  </script>
</body>
</html>
